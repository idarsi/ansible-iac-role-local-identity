---
name: Ansible role checks

"on":
  push:
  pull_request:

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Python 3.12 removed distutils.  setuptools provides its compatible
      # shim to collections that still import distutils (notably Podman).
      # Do not install Ubuntu's python3-distutils: it targets the system
      # interpreter, not the interpreter installed by setup-python.
      - name: Install Python compatibility shim
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==75.8.0
      - name: Install Ansible tooling
        run: >-
          python -m pip install ansible-core==2.21.3 ansible-lint==26.8.0
      - name: Install role collections
        run: |
          max_attempts=5
          delay=10
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            echo "Installing role collections"
            echo "Attempt ${attempt}/${max_attempts}"
            if ansible-galaxy collection install -r requirements.yml; then
              echo "Role collections installed successfully"
              exit 0
            else
              status=$?
            fi
            if (( attempt == max_attempts )); then
              echo "Installation failed after ${max_attempts} attempts" >&2
              exit "$status"
            fi
            echo "Installation failed; retrying in ${delay} seconds" >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
      - name: Run syntax check
        run: ansible-playbook --syntax-check tests/syntax.yml
      - name: Run production-profile Ansible Lint
        run: ansible-lint --profile production .
      - name: Write CI evidence report
        if: "${{ success() }}"
        env:
          EVIDENCE_REPOSITORY: "${{ github.repository }}"
          EVIDENCE_WORKFLOW: "${{ github.workflow }}"
          EVIDENCE_RUN_ID: "${{ github.run_id }}"
          EVIDENCE_RUN_ATTEMPT: "${{ github.run_attempt }}"
          EVIDENCE_SHA: "${{ github.sha }}"
        run: |
          mkdir -p evidence
          report="evidence/ci-evidence-lint-${EVIDENCE_RUN_ID}-${EVIDENCE_RUN_ATTEMPT}-${EVIDENCE_SHA}.md"
          {
            printf '%s\n' "# CI evidence report"
            printf '%s\n' "- Repository: ${EVIDENCE_REPOSITORY}"
            printf '%s\n' "- Workflow: ${EVIDENCE_WORKFLOW}"
            printf '%s\n' "- Run ID: ${EVIDENCE_RUN_ID}"
            printf '%s\n' "- Run attempt: ${EVIDENCE_RUN_ATTEMPT}"
            printf '%s\n' "- Commit SHA: ${EVIDENCE_SHA}"
            printf '%s\n' "- Platform: not applicable"
            printf '%s\n' "- Image: not applicable"
            printf '%s\n' "- Scenario: not applicable"
            printf '%s\n' "- Tool/test command: ansible-playbook --syntax-check tests/syntax.yml; ansible-lint --profile production ."
            printf '%s\n' "- Result: success"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI evidence report
        if: "${{ success() }}"
        uses: actions/upload-artifact@v4
        with:
          name: "ci-evidence-lint-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          path: "evidence/ci-evidence-lint-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.md"
          if-no-files-found: "error"

  molecule:
    name: Molecule ${{ matrix.scenario }} (${{ matrix.platform.name }})
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: RHEL UBI 9
            image: registry.access.redhat.com/ubi9/ubi-init:latest
          - name: RHEL UBI 10
            image: registry.access.redhat.com/ubi10/ubi-init:latest
          - name: Rocky Linux 9
            image: rockylinux:9
          - name: Rocky Linux 10
            image: quay.io/rockylinux/rockylinux:10
          - name: Ubuntu 22.04
            image: geerlingguy/docker-ubuntu2204-ansible:latest
        scenario: [validation, baseline, lifecycle, guardrails, all_absent]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Python 3.12 removed distutils.  setuptools provides its compatible
      # shim to collections that still import distutils (notably Podman).
      # Do not install Ubuntu's python3-distutils: it targets the system
      # interpreter, not the interpreter installed by setup-python.
      - name: Install Python compatibility shim
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==75.8.0
      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman info
      - name: Install Ansible tooling
        run: >-
          python -m pip install ansible-core==2.21.3 molecule==26.8.0
          molecule-plugins[podman]==26.7.15
      - name: Install role collections
        run: |
          max_attempts=5
          delay=10
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            echo "Installing role collections"
            echo "Attempt ${attempt}/${max_attempts}"
            if ansible-galaxy collection install -r requirements.yml; then
              echo "Role collections installed successfully"
              exit 0
            else
              status=$?
            fi
            if (( attempt == max_attempts )); then
              echo "Installation failed after ${max_attempts} attempts" >&2
              exit "$status"
            fi
            echo "Installation failed; retrying in ${delay} seconds" >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
      - name: Run Molecule scenario
        env:
          MOLECULE_IMAGE: ${{ matrix.platform.image }}
        run: molecule test -s ${{ matrix.scenario }}
      - name: Write CI evidence report
        if: "${{ success() }}"
        env:
          EVIDENCE_REPOSITORY: "${{ github.repository }}"
          EVIDENCE_WORKFLOW: "${{ github.workflow }}"
          EVIDENCE_RUN_ID: "${{ github.run_id }}"
          EVIDENCE_RUN_ATTEMPT: "${{ github.run_attempt }}"
          EVIDENCE_SHA: "${{ github.sha }}"
          EVIDENCE_PLATFORM: "${{ matrix.platform.name }}"
          EVIDENCE_IMAGE: "${{ matrix.platform.image }}"
          EVIDENCE_SCENARIO: "${{ matrix.scenario }}"
        run: |
          mkdir -p evidence
          report="evidence/ci-evidence-${EVIDENCE_SCENARIO}-${EVIDENCE_RUN_ID}-${EVIDENCE_RUN_ATTEMPT}-${EVIDENCE_SHA}.md"
          {
            printf '%s\n' "# CI evidence report"
            printf '%s\n' "- Repository: ${EVIDENCE_REPOSITORY}"
            printf '%s\n' "- Workflow: ${EVIDENCE_WORKFLOW}"
            printf '%s\n' "- Run ID: ${EVIDENCE_RUN_ID}"
            printf '%s\n' "- Run attempt: ${EVIDENCE_RUN_ATTEMPT}"
            printf '%s\n' "- Commit SHA: ${EVIDENCE_SHA}"
            printf '%s\n' "- Platform: ${EVIDENCE_PLATFORM}"
            printf '%s\n' "- Image: ${EVIDENCE_IMAGE}"
            printf '%s\n' "- Scenario: ${EVIDENCE_SCENARIO}"
            printf '%s\n' "- Tool/test command: MOLECULE_IMAGE=${EVIDENCE_IMAGE} molecule test -s ${EVIDENCE_SCENARIO}"
            printf '%s\n' "- Result: success"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI evidence report
        if: "${{ success() }}"
        uses: actions/upload-artifact@v4
        with:
          name: "ci-evidence-${{ matrix.scenario }}-${{ matrix.platform.name }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          path: "evidence/ci-evidence-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.md"
          if-no-files-found: "error"
