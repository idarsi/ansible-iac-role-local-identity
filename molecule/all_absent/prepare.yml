---
- name: Create the all_absent fixture inside the container
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the fixture user
      ansible.builtin.user:
        name: all_absent_user
        home: /home/all_absent_user
        create_home: true
        shell: /bin/bash

    - name: Create the declared group fixture
      ansible.builtin.group:
        name: all_absent_group
        gid: 1710
        state: present

    - name: Create the fixture sudoers file
      ansible.builtin.copy:
        dest: /etc/sudoers.d/all_absent_user
        content: |-
          # Managed by ansible role local_identity. Do not edit this file.
          all_absent_user ALL=(root) /usr/bin/true
        owner: root
        group: root
        mode: '0440'

    - name: Create an unmanaged sudoers sentinel with a misplaced marker
      ansible.builtin.copy:
        dest: /etc/sudoers.d/all_absent_unmanaged
        content: |-
          # This is not a role-managed sudoers file.
          # Managed by ansible role local_identity. Do not edit this file.
          all_absent_user ALL=(root) /usr/bin/true
        owner: root
        group: root
        mode: '0440'

    - name: Create the role-managed home marker fixture
      ansible.builtin.copy:
        dest: /home/all_absent_user/.ansible-iac-role-local-identity-managed
        content: "Managed by ansible-iac-role-local-identity; do not remove.\n"
        owner: all_absent_user
        group: all_absent_user
        mode: '0600'

    - name: Create an unmanaged home as a deletion sentinel
      ansible.builtin.file:
        path: /home/all_absent_wrong_home
        state: directory
        mode: '0755'
