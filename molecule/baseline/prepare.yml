---
- name: Prepare deterministic baseline user fixtures
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure the new-user fixture account is absent
      ansible.builtin.user:
        name: baseline_user
        state: absent
        remove: false

    - name: Ensure the GID-reuse fixture account is absent
      ansible.builtin.user:
        name: baseline_reuse_user
        state: absent
        remove: false

    - name: Ensure the declared group fixture is absent
      ansible.builtin.group:
        name: baseline_shared
        state: absent

    - name: Ensure the new-user fixture home is absent
      ansible.builtin.file:
        path: /home/baseline_user
        state: absent

    - name: Ensure the GID-reuse fixture home is absent
      ansible.builtin.file:
        path: /home/baseline_reuse_user
        state: absent

    - name: Ensure the implicit-home fixture account is absent
      ansible.builtin.user:
        name: baseline_implicit_user
        state: absent
        remove: false

    - name: Ensure the implicit-home fixture home is absent
      ansible.builtin.file:
        path: /home/baseline_implicit_user
        state: absent

    - name: Create the existing-home fixture
      ansible.builtin.file:
        path: /home/baseline_existing_user
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create a supplementary group for empty-list replacement coverage
      ansible.builtin.group:
        name: baseline_extra
        state: present

    - name: Create the existing-home user fixture with an extra group
      ansible.builtin.user:
        name: baseline_existing_user
        home: /home/baseline_existing_user
        groups: baseline_extra
        append: true
        create_home: false
