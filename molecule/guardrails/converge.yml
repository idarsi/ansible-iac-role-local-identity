    - name: Discover a remote-only NSS group when the image provides one
      ansible.builtin.command: getent group
      register: local_identity_all_nss_groups
      changed_when: false
      check_mode: false
    - name: Discover local-files NSS groups
      ansible.builtin.command: getent -s files group
