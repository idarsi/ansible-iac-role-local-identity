---
- name: Exercise local_identity guardrails in a container
  hosts: all
  gather_facts: true
  tasks:
    - name: Create the guardrail fixture user
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
      vars:
        iac_blueprint:
          local_identity:
            state: present
            users:
              - name: guardrail_user

    - name: Exercise destructive state in check mode
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
        apply:
          check_mode: true
      tags:
        - molecule-idempotence-notest
      vars:
        iac_blueprint:
          local_identity:
            state: absent
            allow_user_deletion: true
            users:
              - name: guardrail_user

    - name: Confirm check mode preserved the guardrail fixture user
      ansible.builtin.getent:
        database: passwd
        key: guardrail_user
    - name: Assert destructive check mode made no account mutation
      ansible.builtin.assert:
        that: "'guardrail_user' in getent_passwd"

    - name: Reject deletion without explicit opt-in
      block:
        - name: Run deletion with its safety flag disabled
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                users:
                  - name: guardrail_user
        - name: Record unexpected successful deletion
          ansible.builtin.set_fact:
            local_identity_deletion_guardrail_role:
              failed: false
              msg: ''
      rescue:
        - name: Record the deletion guardrail error
          ansible.builtin.set_fact:
            local_identity_deletion_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert the expected deletion guardrail failure
      ansible.builtin.assert:
        that:
          - local_identity_deletion_guardrail_role.failed | default(false)
          - >-
            (local_identity_deletion_guardrail_role.result | default('')) is
            search('User deletion requires')
        fail_msg: >-
          Deletion guardrail was accepted or failed for the wrong reason.

    - name: Create an unmanaged user and home deletion sentinel
      ansible.builtin.user:
        name: unmanaged_home_user
        home: /home/unmanaged_home_user
        create_home: true

    - name: Create an unmanaged sudoers deletion sentinel
      ansible.builtin.copy:
        dest: /etc/sudoers.d/unmanaged_home_user
        content: |-
          # marker-like text is not a management header
          # Managed by ansible role local_identity.
          unmanaged_home_user ALL=(root) /usr/bin/true
        owner: root
        group: root
        mode: '0440'

    - name: Create a portable non-root group for the ownership sentinel
      ansible.builtin.group:
        name: guardrail_unmanaged_group
        state: present

    - name: Create a shared group deletion sentinel
      ansible.builtin.group:
        name: guardrail_shared_group
        gid: 1703
        state: present
    - name: Add the fixture user to the shared group sentinel
      ansible.builtin.user:
        name: guardrail_user
        groups: [guardrail_shared_group]
        append: true

    - name: Create a primary-group ownership sentinel
      ansible.builtin.group:
        name: guardrail_primary_group
        gid: 1704
        state: present
    - name: Create an undeclared user owning the primary-group sentinel
      ansible.builtin.user:
        name: guardrail_primary_user
        group: guardrail_primary_group
        create_home: false

    - name: Reject removal of a group owned by an undeclared primary group user
      block:
        - name: Run primary-group-owned deletion with explicit opt-in
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                allow_group_deletion: true
                users: []
                groups:
                  - name: guardrail_primary_group
                    gid: 1704
        - name: Record unexpected primary-group deletion success
          ansible.builtin.set_fact:
            local_identity_primary_group_guardrail_role:
              failed: false
      rescue:
        - name: Record the primary-group ownership guardrail error
          ansible.builtin.set_fact:
            local_identity_primary_group_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert undeclared primary-group ownership was rejected
      ansible.builtin.assert:
        that:
          - local_identity_primary_group_guardrail_role.failed | default(false)
          - >-
            (local_identity_primary_group_guardrail_role.result | default('')) is
            search('primary group')

    - name: Allow a nonexistent declared group without deletion opt-in
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
      vars:
        iac_blueprint:
          local_identity:
            state: absent
            users: []
            groups:
              - name: guardrail_nonexistent_group

    - name: Create groups for GID preservation guardrails
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop:
        - {name: guardrail_omitted_gid_group, gid: 1705}
        - {name: guardrail_mismatched_gid_group, gid: 1706}

    - name: Create the group-only all_absent fixture
      ansible.builtin.group:
        name: guardrail_all_absent_group
        gid: 1708
        state: present
      tags:
        - molecule-idempotence-notest

    - name: Reject group-only all_absent without its explicit opt-in
      block:
        - name: Run group-only all_absent with allow_all_absent disabled
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: all_absent
                allow_group_deletion: true
                users: []
                groups:
                  - name: guardrail_all_absent_group
                    gid: 1708
        - name: Record unexpected group-only all_absent success
          ansible.builtin.set_fact:
            local_identity_group_only_all_absent_guardrail_role:
              failed: false
      rescue:
        - name: Record the group-only all_absent authorization error
          ansible.builtin.set_fact:
            local_identity_group_only_all_absent_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert group-only all_absent requires explicit authorization
      ansible.builtin.assert:
        that:
          - local_identity_group_only_all_absent_guardrail_role.failed | default(false)
          - >-
            (local_identity_group_only_all_absent_guardrail_role.result |
            default('')) is search('all_absent requires allow_all_absent')

    - name: Remove the declared group with group-only all_absent
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
      tags:
        - molecule-idempotence-notest
      vars:
        iac_blueprint:
          local_identity:
            state: all_absent
            allow_all_absent: true
            allow_group_deletion: true
            users: []
            groups:
              - name: guardrail_all_absent_group
                gid: 1708

    - name: Reject removal when the declared GID is omitted
      block:
        - name: Run omitted-GID group deletion
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                allow_group_deletion: true
                users: []
                groups:
                  - name: guardrail_omitted_gid_group
        - name: Record unexpected omitted-GID deletion success
          ansible.builtin.set_fact:
            local_identity_omitted_gid_guardrail_role: {failed: false}
      rescue:
        - name: Record omitted-GID preservation error
          ansible.builtin.set_fact:
            local_identity_omitted_gid_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert omitted-GID group removal was rejected
      ansible.builtin.assert:
        that:
          - local_identity_omitted_gid_guardrail_role.failed | default(false)
          - >-
            (local_identity_omitted_gid_guardrail_role.result | default('')) is
            search('declared GID')

    - name: Reject removal when the declared GID mismatches
      block:
        - name: Run mismatched-GID group deletion
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                allow_group_deletion: true
                users: []
                groups:
                  - name: guardrail_mismatched_gid_group
                    gid: 1707
        - name: Record unexpected mismatched-GID deletion success
          ansible.builtin.set_fact:
            local_identity_mismatched_gid_guardrail_role: {failed: false}
      rescue:
        - name: Record mismatched-GID preservation error
          ansible.builtin.set_fact:
            local_identity_mismatched_gid_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert mismatched-GID group removal was rejected
      ansible.builtin.assert:
        that:
          - local_identity_mismatched_gid_guardrail_role.failed | default(false)
          - >-
            (local_identity_mismatched_gid_guardrail_role.result | default('')) is
            search('declared GID')

    - name: Reject group deletion without explicit opt-in
      block:
        - name: Run group deletion with its safety flag disabled
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                users: []
                groups:
                  - name: guardrail_shared_group
                    gid: 1703
        - name: Record unexpected group deletion success
          ansible.builtin.set_fact:
            local_identity_group_opt_in_guardrail_role:
              failed: false
      rescue:
        - name: Record the group deletion guardrail error
          ansible.builtin.set_fact:
            local_identity_group_opt_in_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert group deletion requires explicit opt-in
      ansible.builtin.assert:
        that:
          - local_identity_group_opt_in_guardrail_role.failed | default(false)
          - >-
            (local_identity_group_opt_in_guardrail_role.result | default('')) is
            search('allow_group_deletion')

    - name: Reject removal of a shared local group
      block:
        - name: Run shared group deletion with explicit opt-in
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                allow_group_deletion: true
                users: []
                groups:
                  - name: guardrail_shared_group
                    gid: 1703
        - name: Record unexpected shared group deletion success
          ansible.builtin.set_fact:
            local_identity_shared_group_guardrail_role:
              failed: false
      rescue:
        - name: Record the shared group guardrail error
          ansible.builtin.set_fact:
            local_identity_shared_group_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert shared group removal was rejected
      ansible.builtin.assert:
        that:
          - local_identity_shared_group_guardrail_role.failed | default(false)
          - >-
            (local_identity_shared_group_guardrail_role.result | default('')) is
            search('every supplementary member')

    - name: Create an exact-header sudoers ownership sentinel
      ansible.builtin.copy:
        dest: /etc/sudoers.d/exact_header_unmanaged
        content: |-
          # Managed by ansible role local_identity. Do not edit this file.
          exact_header_unmanaged ALL=(root) /usr/bin/true
        owner: nobody
        group: guardrail_unmanaged_group
        mode: '0440'

    - name: Reject exact-header sudoers file with unsafe metadata
      block:
        - name: Run a sudoers update against the ownership sentinel
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: present
                users:
                  - name: exact_header_unmanaged
                    sudo_rules:
                      - 'exact_header_unmanaged ALL=(root) /usr/bin/true'
        - name: Record unexpected unsafe sudoers overwrite
          ansible.builtin.set_fact:
            local_identity_sudoers_metadata_guardrail_role:
              failed: false
      rescue:
        - name: Record the sudoers metadata guardrail error
          ansible.builtin.set_fact:
            local_identity_sudoers_metadata_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"

    - name: Assert unsafe sudoers metadata was rejected
      ansible.builtin.assert:
        that:
          - >-
            local_identity_sudoers_metadata_guardrail_role.failed |
            default(false)
          - >-
            (local_identity_sudoers_metadata_guardrail_role.result |
            default('')) is search('unmanaged sudoers file')
        fail_msg: Exact-header sudoers file with unsafe metadata was accepted.

    - name: Reject removal of a home without its role-managed marker
      block:
        - name: Run marked home removal against an unmanaged home
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: absent
                allow_user_deletion: true
                allow_home_removal: true
                users:
                  - name: unmanaged_home_user
                    home: /home/unmanaged_home_user
                    remove_home: true
        - name: Record unexpected unmanaged home removal
          ansible.builtin.set_fact:
            local_identity_unmanaged_home_guardrail_role:
              failed: false
              msg: ''
      rescue:
        - name: Record the unmanaged home guardrail error
          ansible.builtin.set_fact:
            local_identity_unmanaged_home_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert the expected unmanaged home guardrail failure
      ansible.builtin.assert:
        that:
          - local_identity_unmanaged_home_guardrail_role.failed | default(false)
          - >-
            (local_identity_unmanaged_home_guardrail_role.result | default(''))
            is search('role-managed marker')
        fail_msg: >-
          Unmanaged home guardrail was accepted or failed for the wrong reason.

    - name: Reject all_absent without its explicit opt-in
      block:
        - name: Run all_absent with its safety flag disabled
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: all_absent
                users: []
        - name: Record unexpected all_absent success
          ansible.builtin.set_fact:
            local_identity_all_absent_guardrail_role:
              failed: false
              msg: ''
      rescue:
        - name: Record the all_absent guardrail error
          ansible.builtin.set_fact:
            local_identity_all_absent_guardrail_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"
    - name: Assert the expected all_absent guardrail failure
      ansible.builtin.assert:
        that:
          - local_identity_all_absent_guardrail_role.failed | default(false)
          - >-
            (local_identity_all_absent_guardrail_role.result | default('')) is
            search('all_absent requires allow_all_absent')
        fail_msg: >-
          all_absent guardrail was accepted or failed for the wrong reason.

    - name: Create a conflicting same-named primary group
      ansible.builtin.group:
        name: gid_conflict_user
        gid: 1700
        state: present

    - name: Reject changing the conflicting group's GID
      block:
        - name: Run the conflicting numeric GID blueprint
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."
          vars:
            iac_blueprint:
              local_identity:
                state: present
                users:
                  - name: gid_conflict_user
                    gid: 1701
        - name: Record unexpected conflicting GID success
          ansible.builtin.set_fact:
            local_identity_gid_conflict_role:
              failed: false
      rescue:
        - name: Record the conflicting GID guardrail error
          ansible.builtin.set_fact:
            local_identity_gid_conflict_role:
              failed: true
              result: "{{ ansible_failed_result | to_nice_json }}"

    - name: Assert the conflicting GID was rejected
      ansible.builtin.assert:
        that:
          - local_identity_gid_conflict_role.failed | default(false)
          - >-
            (local_identity_gid_conflict_role.result | default('')) is
            search('different GID')
        fail_msg: Conflicting primary group GID was not rejected.
