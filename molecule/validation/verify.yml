---
- name: Verify validation made no account or file changes
  hosts: all
  gather_facts: true
  tasks:
    - name: Read the before-validation snapshot
      ansible.builtin.slurp:
        src: /tmp/local_identity_validation_before.snapshot
      register: local_identity_validation_before_snapshot

    - name: Read the validation fixture account before validation
      ansible.builtin.command: getent -s files passwd validation_absent_fixture
      changed_when: false
      failed_when: local_identity_validation_user_before.rc not in [0, 2]
      register: local_identity_validation_user_before
    - name: Read the validation fixture sudoers file before validation
      ansible.builtin.stat:
        path: /etc/sudoers.d/validation_absent_fixture
      register: local_identity_validation_sudoers_before
    - name: Run a read-only validation during verify
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
      vars:
        iac_blueprint:
          local_identity:
            state: validate
            users:
              - name: validation_absent_fixture
    - name: Read the validation fixture account after validation
      ansible.builtin.command: getent -s files passwd validation_absent_fixture
      changed_when: false
      failed_when: local_identity_validation_user_after.rc not in [0, 2]
      register: local_identity_validation_user_after
    - name: Read the validation fixture sudoers file after validation
      ansible.builtin.stat:
        path: /etc/sudoers.d/validation_absent_fixture
      register: local_identity_validation_sudoers_after
    - name: Set read-only validation snapshots
      ansible.builtin.set_fact:
        local_identity_validation_before:
          user_exists: "{{ local_identity_validation_user_before.rc == 0 }}"
          sudoers: "{{ local_identity_validation_sudoers_before.stat.exists }}"
        local_identity_validation_after:
          user_exists: "{{ local_identity_validation_user_after.rc == 0 }}"
          sudoers: "{{ local_identity_validation_sudoers_after.stat.exists }}"
    - name: Assert validation did not mutate the container
      ansible.builtin.assert:
        that:
          - (local_identity_validation_before_snapshot.content | b64decode) == "user_exists=false\nsudoers_exists=false\n"
          - not local_identity_validation_before.user_exists
          - local_identity_validation_before.sudoers == false
          - not local_identity_validation_after.user_exists
          - local_identity_validation_after.sudoers == false
          - local_identity_validation_before == local_identity_validation_after
        fail_msg: >-
          Read-only validation assertion failed: {{
          {'actual_decoded_snapshot':
          (local_identity_validation_before_snapshot.content | default('', true) | b64decode),
          'expected_snapshot': 'user_exists=false\nsudoers_exists=false\n',
          'before_user_exists': local_identity_validation_before.user_exists,
          'before_sudoers_exists': local_identity_validation_before.sudoers,
          'after_user_exists': local_identity_validation_after.user_exists,
          'after_sudoers_exists': local_identity_validation_after.sudoers} | to_json }}
