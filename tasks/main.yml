---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: Checking if operating system is supported
  ansible.builtin.fail:
    msg: >-
      Unsupported operating system: {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}. Supported platforms
      are defined by iac_supported_os.
  when: >
    iac_supported_os | selectattr(
      'name', 'equalto',
      ('EL' if ansible_facts['distribution'] in ['RedHat', 'Rocky']
      else ansible_facts['distribution'])
    )
    | selectattr('versions', 'contains',
    ansible_facts['distribution_major_version'])
    | list | length == 0

###############################################################################
# CHECKING BLUEPRINT EXECUTION CONTEXT
###############################################################################

- name: Checking local_identity blueprint execution context
  ansible.builtin.assert:
    that:
      - iac_blueprint is defined
    fail_msg: "iac_blueprint is not defined"

- name: Checking local_identity blueprint root type
  ansible.builtin.assert:
    that:
      - iac_blueprint | type_debug == "dict"
    fail_msg: "iac_blueprint must be a mapping containing local_identity"

- name: Checking local_identity service blueprint
  ansible.builtin.assert:
    that:
      - iac_blueprint.local_identity is defined
    fail_msg: "iac_blueprint.local_identity is not defined"

- name: Set normalized local_identity state
  ansible.builtin.set_fact:
    iac_state: >-
      {{ iac_blueprint.local_identity.state | default(local_identity_state) }}

- name: Validate the complete local_identity inventory
  ansible.builtin.include_tasks: validate/validate_inventory.yml

- name: Normalize the local_identity inventory
  ansible.builtin.include_tasks: normalize.yml

- name: Preflight sudoers content before present-state mutations
  ansible.builtin.include_tasks: validate_sudoers_preflight.yml
  when: iac_state == 'present'

- name: Preflight existing identity numeric changes before present mutations
  ansible.builtin.include_tasks: validate_identity_preflight.yml
  when: iac_state == 'present'

- name: Preflight local NSS identities before destructive mutations
  ansible.builtin.include_tasks: validate_identity_nss_preflight.yml
  when: iac_state in ['absent', 'all_absent']

- name: Preflight SSH paths before present-state mutations
  ansible.builtin.include_tasks: validate_ssh_preflight.yml
  loop: "{{ local_identity_normalized_users }}"
  loop_control:
    loop_var: local_identity_ssh_user
    label: "{{ local_identity_ssh_user.name }}"
  when: iac_state == 'present'

- name: Run validation state
  ansible.builtin.include_tasks: validate_only.yml
  when: iac_state == 'validate'

- name: Run present state
  ansible.builtin.include_tasks: present.yml
  when: iac_state == 'present'

- name: Run absent state
  ansible.builtin.include_tasks: absent.yml
  when: iac_state == 'absent'

- name: Run all absent state
  ansible.builtin.include_tasks: all_absent.yml
  when: iac_state == 'all_absent'
