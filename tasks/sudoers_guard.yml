---
- name: Inspect the target sudoers file
  ansible.builtin.stat:
    path: "{{ local_identity_sudoers_target }}"
    follow: false
  register: local_identity_sudoers_stat

- name: Read the first line of an existing sudoers file
  ansible.builtin.command:
    cmd: >-
      awk 'NR == 1 { print; exit }'
      {{ local_identity_sudoers_target | quote }}
  register: local_identity_sudoers_header
  changed_when: false
  check_mode: false
  when:
    - local_identity_sudoers_stat.stat.exists
    - local_identity_sudoers_stat.stat.isreg
    - not (local_identity_sudoers_stat.stat.islnk | default(false) | bool)

- name: Determine whether the sudoers file has the exact management header
  ansible.builtin.set_fact:
    local_identity_sudoers_is_managed: >-
      {{ (local_identity_sudoers_stat.stat.exists | default(false) | bool) and
      (local_identity_sudoers_stat.stat.isreg | default(false) | bool) and
       not (local_identity_sudoers_stat.stat.islnk | default(false) | bool) and
      (local_identity_sudoers_stat.stat.uid | default(-1) | int) == 0 and
      (local_identity_sudoers_stat.stat.gid | default(-1) | int) == 0 and
      ((local_identity_sudoers_stat.stat.mode | default('')) ==
       (local_identity_sudoers_file_mode | string)) and
      ((local_identity_sudoers_header.stdout | default(''))
      == (local_identity_sudoers_marker ~ ' Do not edit this file.')) }}

- name: Refuse an unmanaged or symlinked sudoers target
  ansible.builtin.assert:
    that:
      - >-
        not (local_identity_sudoers_stat.stat.exists | default(false) | bool) or
        local_identity_sudoers_is_managed
    fail_msg: >-
      Refusing to {{ 'overwrite' if local_identity_sudoers_guard_mode ==
      'overwrite' else 'remove' }} unmanaged sudoers file
      {{ local_identity_sudoers_target }}.

- name: Remove the role-managed sudoers file
  ansible.builtin.file:
    path: "{{ local_identity_sudoers_target }}"
    state: absent
  when:
    - local_identity_sudoers_guard_mode == 'remove'
    - local_identity_sudoers_stat.stat.exists
    - local_identity_sudoers_is_managed
