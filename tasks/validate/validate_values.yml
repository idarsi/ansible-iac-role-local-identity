---
- name: Validate authorized keys and sudo rules are single-line strings
  ansible.builtin.assert:
    that:
      - local_identity_value is string
      - "local_identity_value.find('\\n') == -1"
    fail_msg: Values in authorized_keys and sudo_rules must be single-line strings.
  loop: >-
    {{ (local_identity_values_user.groups | default([])) +
    (local_identity_values_user.authorized_keys | default([])) +
    (local_identity_values_user.sudo_rules | default([])) }}
  loop_control:
    loop_var: local_identity_value

- name: Validate authorized keys at the role boundary
  ansible.builtin.assert:
    that:
      - >-
        local_identity_key is match(
        '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|'
        'ecdsa-sha2-nistp521|sk-ssh-ed25519@openssh.com|'
        'sk-ecdsa-sha2-nistp256@openssh.com) [A-Za-z0-9+/]+={0,2}( .*)?$')
    fail_msg: >-
      Authorized keys must be one plain OpenSSH public-key line: a supported
      key type, base64 key blob, and optional comment; options and certificates
      are not accepted.
  loop: "{{ local_identity_values_user.authorized_keys | default([]) }}"
  loop_control:
    loop_var: local_identity_key

- name: Validate Linux group names
  ansible.builtin.assert:
    that:
      - local_identity_group_name is string
      - local_identity_group_name | length > 0
      - local_identity_group_name is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: >-
      Each groups entry must be a non-empty Linux-safe name of at most 32
      characters, starting with a lowercase letter or underscore.
  loop: "{{ local_identity_values_user.groups | default([]) }}"
  loop_control:
    loop_var: local_identity_group_name
    label: "{{ local_identity_values_user.name }}"
