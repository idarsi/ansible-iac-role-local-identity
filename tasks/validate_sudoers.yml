---
- name: Run visudo against rendered content from stdin
  ansible.builtin.command:
    argv:
      - visudo
      - -cf
      - /dev/stdin
    stdin: |-
      {{ local_identity_sudoers_marker }} Do not edit this file.
      {% for local_identity_sudo_rule in local_identity_sudo_validation_user.sudo_rules %}
      {{ local_identity_sudo_rule }}
      {% endfor %}
  changed_when: false
  check_mode: false
  register: local_identity_visudo_result
  failed_when: local_identity_visudo_result.rc != 0
